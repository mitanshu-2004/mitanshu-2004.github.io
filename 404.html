<script>
/* Applies a saved theme before first paint. Inline and synchronous on purpose:
   deferred in an external file this runs after the first frame and the page
   flashes the wrong scheme. No stored choice means no attribute, which leaves
   `color-scheme: light dark` to follow the operating system. */
(function(){try{var t=localStorage.getItem("theme");
if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);}catch(e){}})();
</script>
